name: Hybrid CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

# Global environment variables
env:
  DOCKER_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  # PERBAIKAN: Mengambil nama repositori saja agar formatnya tidak menjadi johanputra/johanputra/repo
  DOCKER_IMAGE_ID: ${{ github.event.repository.name }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Source Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Sanitize Variables (Docker registry requires lowercase)
      - name: Format Variables to Lowercase
        run: |
          echo "DOCKER_USERNAME=$(echo ${{ env.DOCKER_USERNAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "DOCKER_IMAGE_ID=$(echo ${{ env.DOCKER_IMAGE_ID }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Step 3: Registry Auth (Requires DOCKERHUB_TOKEN repository secret)
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      # Step 4: Container Build Sequence
      - name: Build Docker Image
        run: docker build -t ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_ID }}:${{ env.IMAGE_TAG }} .

      # Step 5: Ephemeral Verification (Smoke Test)
      - name: Verify Container
        run: docker run --rm ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_ID }}:${{ env.IMAGE_TAG }} nginx -v

      # Step 6: Static Image Security Scan
      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_ID }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Step 7: Layer Tagging and Upload
      - name: Push to Docker Hub
        run: |
          docker tag ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_ID }}:${{ env.IMAGE_TAG }} ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_ID }}:latest
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_ID }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_ID }}:latest