name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Global environment variables
env:
  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
  DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
  DOCKER_IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Source Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Validate Credentials & Format Variables to Lowercase
      - name: Validate & Format Variables
        run: |
          if [ -z "${{ env.DOCKER_USERNAME }}" ] || [ -z "${{ env.DOCKER_TOKEN }}" ]; then
            echo "::error::Kredensial Docker Hub belum diset! Silakan tambahkan Secret DOCKERHUB_USERNAME dan DOCKERHUB_TOKEN di menu: Settings > Secrets and variables > Actions"
            exit 1
          fi
          
          # Docker Hub requires lowercase repository and username
          LOWER_USER=$(echo "${{ env.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          LOWER_IMAGE=$(echo "${{ env.DOCKER_IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          echo "DOCKER_USERNAME=$LOWER_USER" >> $GITHUB_ENV
          echo "DOCKER_IMAGE_NAME=$LOWER_IMAGE" >> $GITHUB_ENV

      # Step 3: Registry Auth
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      # Step 4: Container Build Sequence
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest .

      # Step 5: Ephemeral Verification (Smoke Test)
      - name: Verify Container
        run: |
          docker run --rm ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }} nginx -v

      # Step 6: Static Image Security Scan (Informative)
      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: '${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Step 7: Push Image to Docker Hub
      - name: Push to Docker Hub
        run: |
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest